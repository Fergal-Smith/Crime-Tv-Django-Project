{% extends 'base.html' %}

{% block content %}
<h2>Reviews</h2>

<a href="{% url 'review_create' %}" class="btn btn-primary">Add Review</a>

<ul>
    {% for review in object_list %}
        <li>
            {{ review.show }} - {{ review.rating }} 
            <br>
            {{ review.comment }}
        </li>
    {% endfor %}
</ul>
{% endblock %}
