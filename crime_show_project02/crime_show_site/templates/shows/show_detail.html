{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>{{ show.title }}</h2>
    <p><strong>Network:</strong> {{ show.network }}</p>
    <p><strong>Year:</strong> {{ show.year }}</p>
    {% if show.pic %}
        <img src="{{ show.pic.url }}" alt="{{ show.title }}" class="img-fluid mb-3">
    {% endif %}
    <div class="mb-3">
        <a href="{% url 'show_update' show.id %}" class="btn btn-warning">Edit</a>
        <a href="{% url 'show_delete' show.id %}" class="btn btn-danger">Delete</a>
        <a href="{% url 'show_list' %}" class="btn btn-secondary">Back to List</a>
    </div>
</div>
{% endblock %}
