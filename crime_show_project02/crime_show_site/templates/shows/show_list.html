{% extends 'base.html' %}
{% block content %}
<h1>All Shows</h1>

<div class="show-grid">
  {% for show in shows %}
    <div class="show-card">

      <h2>
        <a href="{% url 'show_detail' show.id %}">{{ show.title }}</a>
      </h2>

      {% if show.image %}
        <img src="{{ show.image.url }}" alt="{{ show.title }}" width="150">
      {% endif %}

      <p><strong>Genre:</strong> {{ show.genre }}</p>
      <p>{{ show.description|truncatewords:25 }}</p>

    </div>
  {% empty %}
    <p>No shows available.</p>
  {% endfor %}
</div>
{% endblock %}
