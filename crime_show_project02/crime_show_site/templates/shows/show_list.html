{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-3">All Crime TV Shows</h2>
    <a href="{% url 'show_create' %}" class="btn btn-primary mb-3">Add New Show</a>
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>Title</th>
                <th>Network</th>
                <th>Year</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        {% for show in show_list %}
            <tr>
                <td><a href="{% url 'show_detail' show.id %}">{{ show.title }}</a></td>
                <td>{{ show.network }}</td>
                <td>{{ show.year }}</td>
                <td>
                    <a href="{% url 'show_update' show.id %}" class="btn btn-sm btn-warning">Edit</a>
                    <a href="{% url 'show_delete' show.id %}" class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
