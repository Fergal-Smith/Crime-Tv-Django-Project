{% extends 'base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 650px;">

    <div class="card shadow-lg p-4 rounded-4 bg-dark text-white">

        {% if object %}
            <h2 class="mb-3 text-warning">Edit Show</h2>
            <p class="text-muted">Update the details below</p>
        {% else %}
            <h2 class="mb-3 text-success">Add New Show</h2>
            <p class="text-muted">Fill in the details to create a new show</p>
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Title</label>
                {{ form.title }}
            </div>

            <div class="mb-3">
                <label class="form-label">Genre</label>
                {{ form.genre }}
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                {{ form.description }}
            </div>

            <div class="mb-3">
                <label class="form-label">Image</label>
                {{ form.image }}
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-success px-4">
                    {% if object %}Update Show{% else %}Create Show{% endif %}
                </button>

                <a href="{% url 'home' %}" class="btn btn-primary">Submit</button>
                    Cancel
                </a>
            </div>

        </form>
    </div>
</div>
{% endblock %}
