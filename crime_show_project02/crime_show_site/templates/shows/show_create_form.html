{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">

        {% if object %}
    <h2>Edit Show</h2>
{% else %}
    <h2>Add Show</h2>
{% endif %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">Submit</button>
        <a href="{% url 'show_list' %}" class="btn btn-primary">Cancel</a>
    </form>
</div>
{% endblock %}
